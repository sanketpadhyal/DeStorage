name: DeStorage Deployment Pre-flight

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  preflight-and-release:
    name: Deployment Pre-flight & Release Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install Dependencies
        run: npm ci || npm install --legacy-peer-deps

      - name: Run Typecheck & Automated Tests
        run: |
          npm run typecheck
          npm run test:ci

      - name: Compile Production Build
        run: npm run build
        env:
          CI: false
          REACT_APP_PINATA_GATEWAY: ${{ secrets.REACT_APP_PINATA_GATEWAY || 'gateway.pinata.cloud' }}
          REACT_APP_BASE_SEPOLIA_RPC: ${{ secrets.REACT_APP_BASE_SEPOLIA_RPC || 'https://sepolia.base.org' }}

      - name: Pre-flight Health Check
        run: |
          echo "Deployment artifact validated."
          echo "Bundle Size: $(du -sh build/)"
          ls -la build/
